[project]
name = "ubilife-analysis"
version = "0.1.0"
description = "Analysis pipeline for the UbiLife mobile sensing dataset from UbiComp 2025"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "UbiLife Research Team" }]

dependencies = [
    "carp-analytics-python[all] @ git+https://github.com/Zeroupper/carp-analytics-python.git@fix/parquet-empty-struct-crash",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "folium>=0.14.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
